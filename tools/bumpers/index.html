<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bumpers</title>
<!--
  One bumper, big, and what render.mjs records. The drawing is bumper.js,
  shared with grid.html. Preview: node tools/bumpers/serve.mjs, then
  http://localhost:8996/tools/bumpers/ (grid at grid.html).
  Query: motion, bg, still=1, strength, cta.
-->
<style>
@font-face { font-family: "Archivo"; src: url("../../dataviz/fonts/Archivo-VF.ttf") format("truetype"); font-weight: 100 900; }
:root { --ink: #f2ede2; --stage: #17181b; --accent-hex: #1777b8; --lattice: transparent; color-scheme: dark; }
html, body { margin: 0; background: #0c0d10; color: #f2ede2; font-family: "Archivo", system-ui, sans-serif; }
.wrap { display: flex; gap: 28px; padding: 24px; align-items: flex-start; flex-wrap: wrap; }
.bench { display: flex; flex-direction: column; gap: 16px; max-width: 380px; }
.bench h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
.bench p { margin: 0; font-size: 15px; line-height: 1.5; color: #c9c5bc; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
button, select, input { font: 500 16px/1 "Archivo", system-ui, sans-serif; color: #f2ede2; background: #1d1e22;
  border: 1px solid #3a3c42; border-radius: 2px; padding: 10px 12px; cursor: pointer; }
input[type=text] { cursor: text; width: 100%; box-sizing: border-box; }
button[aria-pressed="true"] { background: #f2ede2; color: #17181b; border-color: #f2ede2; }
label { font-size: 13px; color: #9da0a8; display: block; margin-bottom: 6px; }
a { color: #8cc4ea; }
canvas#out { height: min(86vh, 900px); aspect-ratio: 9 / 16; background: #17181b; box-shadow: 0 0 0 1px #2a2c31; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="out" width="1080" height="1920"></canvas>
  <div class="bench">
    <h1>Bumper</h1>
    <p>1080 × 1920, 30 fps, four seconds. The mark starts and ends as the logo. <a href="grid.html">All backgrounds</a></p>
    <div><label>Logo</label><div class="row" id="motions"></div></div>
    <div><label for="bg">Background</label><select id="bg"></select></div>
    <div><label>Background</label><div class="row" id="mode">
      <button type="button" data-still="0">Moving</button><button type="button" data-still="1">Still</button></div></div>
    <div><label for="strength">Strength <span id="sv"></span></label><input id="strength" type="range" min="0.15" max="0.9" step="0.05"></div>
    <div><label for="cta">Line above the address</label><input id="cta" type="text"></div>
    <div class="row"><button type="button" id="replay">Replay</button><button type="button" id="loop" aria-pressed="true">Loop</button></div>
  </div>
</div>

<script src="../../public/interference/field.js"></script>
<script src="build/gen.js"></script>
<script src="bumper.js"></script>
<script>
"use strict";
var B = window.BUMPERS, q = new URLSearchParams(location.search);
var st = {
  motion: B.MOTIONS[q.get("motion")] ? q.get("motion") : "ringline",
  bg: q.get("bg") || "i:wavefronts",
  still: q.get("still") === "1",
  strength: q.has("strength") ? +q.get("strength") : 0.45,
  cta: q.get("cta") || "Explore more at"
};
var out = document.getElementById("out"), bumper = null, frameNo = 0;

function build() {
  if (bumper) bumper.dispose();
  bumper = B.create(out, st);
  frameNo = 0;
  var p = new URLSearchParams({ motion: st.motion, bg: st.bg, still: st.still ? "1" : "0", strength: st.strength });
  if (q.has("render")) p.set("render", "1");
  history.replaceState(null, "", "?" + p);
}

// for render.mjs: frames are drawn strictly in order, one fixed step apart
window.BUMPER = { FPS: B.FPS, DUR: B.DUR, ready: false, frame: function (i) { bumper.draw(i / B.FPS); return out.toDataURL("image/png"); } };

B.ready().then(function () {
  build();
  window.BUMPER.ready = true;
  if (q.has("render")) return;

  var mh = document.getElementById("motions");
  B.MOTION_ORDER.forEach(function (id) {
    var b = document.createElement("button"); b.type = "button"; b.textContent = B.MOTIONS[id].name;
    b.setAttribute("aria-pressed", String(id === st.motion));
    b.addEventListener("click", function () {
      st.motion = id; bumper.set("motion", id); start = performance.now(); build();
      mh.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    });
    mh.appendChild(b);
  });
  var bs = document.getElementById("bg");
  B.BACKGROUNDS.forEach(function (d) { var o = document.createElement("option"); o.value = d.id; o.textContent = d.name + (d.from ? " (" + d.from + ")" : ""); bs.appendChild(o); });
  bs.value = st.bg;
  bs.addEventListener("change", function () { st.bg = bs.value; build(); start = performance.now(); });
  document.querySelectorAll("#mode button").forEach(function (b) {
    b.setAttribute("aria-pressed", String((b.dataset.still === "1") === st.still));
    b.addEventListener("click", function () {
      st.still = b.dataset.still === "1"; bumper.set("still", st.still);
      document.querySelectorAll("#mode button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    });
  });
  var sr = document.getElementById("strength"), sv = document.getElementById("sv");
  sr.value = st.strength; sv.textContent = st.strength.toFixed(2);
  sr.addEventListener("input", function () { st.strength = +sr.value; sv.textContent = st.strength.toFixed(2); bumper.set("strength", st.strength); });
  var cta = document.getElementById("cta"); cta.value = st.cta;
  cta.addEventListener("input", function () { st.cta = cta.value; bumper.set("cta", cta.value); });
  document.getElementById("replay").addEventListener("click", function () { start = performance.now(); });
  var looping = true;
  document.getElementById("loop").addEventListener("click", function () { looping = !looping; this.setAttribute("aria-pressed", String(looping)); });

  var start = performance.now();
  (function tick(now) {
    var t = (now - start) / 1000;
    if (t > B.DUR + 0.8) { if (looping) { start = now; t = 0; } else t = B.DUR; }
    bumper.draw(Math.min(t, B.DUR), now / 1000);
    requestAnimationFrame(tick);
  })(performance.now());
});
</script>
</body>
</html>
