<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Training compute</title>
<link rel="stylesheet" href="../../templates/frame.css">
<script src="../../vendor/d3.min.js"></script>
</head>
<body>
<script type="module">
import { mountPiece, logAxisLeft, pow10, span } from "../../templates/frame.js";
import { VARIANTS } from "../../templates/variants.js";
import { phyllotaxis } from "../../templates/site-art.js";

const d3 = window.d3;
const SOURCE = "Source: Epoch AI, Notable AI Models (CC BY), data to Sep 2026. Trend: Sevilla &amp; Roldán, Epoch AI (2024).";
const SOURCE_DATA = "Source: Epoch AI, Notable AI Models (CC BY), data to Sep 2026.";
// Direct labels. `at` moves a label into empty space (data coords) with a leader
// line back to its dot; without it the label sits beside the dot.
const LABELS = {
  "AlexNet": { text: "AlexNet", at: [2012.1, 1e19] },
  "AlphaGo Zero": { text: "AlphaGo Zero" },
  "GPT-3 175B (davinci)": { text: "GPT-3", at: [2019.2, 1.2e24] },
  "GPT-4 (Mar 2023)": { text: "GPT-4", at: [2021.4, 2.1e25] },
  "GPT-6 Astra": { text: "GPT-6 Astra", at: [2023.2, 2.2e27] },
};
// The 16:9 cut has about half the pixels per decade, so the stacked labels need more room.
const LABELS_X = {
  ...LABELS,
  "PaLM (540B)": { text: "PaLM", at: [2019.9, 2.5e24] },
  "GPT-3 175B (davinci)": { text: "GPT-3", at: [2019.0, 3e23] },
  "GPT-4 (Mar 2023)": { text: "GPT-4", at: [2021.4, 1.2e25] },
  "Llama 3.1-405B": { text: "Llama 3.1-405B", at: [2021.4, 1.5e26] },
  "Grok 4": { text: "Grok 4", at: [2023.4, 1.4e27] },
  "GPT-6 Astra": { text: "GPT-6 Astra", at: [2023.4, 1.6e28] },
};
const CONF = ["Confident", "Likely", "Speculative"];
const CONF_TEXT = { Confident: "Confident, ±3x", Likely: "Likely, ±10x", Speculative: "Speculative, ±31x", "No estimate": "No estimate" };
const CONF4 = [...CONF, "No estimate"];

// confidence glyph: filled = confident, ring = likely, dotted ring = speculative.
// Shape carries the meaning; colour is the same blue for all three.
function glyph(sel, conf, r) {
  if (conf === "No estimate") {
    const k = r * 0.62;
    sel.append("path").attr("d", `M${-k},${-k}L${k},${k}M${-k},${k}L${k},${-k}`).attr("stroke", "var(--graphite)").attr("stroke-width", Math.max(2.5, r / 6)).attr("stroke-linecap", "round");
    return;
  }
  sel.append("circle").attr("r", r)
    .attr("fill", conf === "Confident" ? "var(--accent)" : "var(--bone)")
    .attr("stroke", "var(--accent)")
    .attr("stroke-width", conf === "Confident" ? 0 : Math.max(2.5, r / 7))
    .attr("stroke-dasharray", conf === "Speculative" ? `${Math.max(2.6, r / 6)} ${Math.max(3.2, r / 5)}` : null);
}

function legendRow(g, items, { gap = 34, size = 21 } = {}) {
  let x = 0;
  for (const it of items) {
    const row = g.append("g").attr("transform", `translate(${x},0)`);
    const w = it.mark(row);
    const t = row.append("text").attr("x", w + 10).attr("dy", "0.34em").attr("class", "lbl-sub").style("font-size", `${size}px`).text(it.text);
    x += w + 10 + t.node().getComputedTextLength() + gap;
  }
  return x;
}

function scatter({ el, width, height, format, data }) {
  const rows = data.models.filter((d) => d.year >= 2010);
  const m = { top: format === "ig" ? 50 : 40, right: 20, bottom: 44, left: 64 };
  const svg = d3.select(el).append("svg").attr("viewBox", `0 0 ${width} ${height}`);
  const x = d3.scaleLinear().domain([2010, 2027]).range([m.left, width - m.right]);
  const y = d3.scaleLog().domain([1e14, 10 ** 28.4]).range([height - m.bottom, m.top]);

  logAxisLeft(svg.append("g").attr("transform", `translate(${m.left},0)`), y, { step: format === "ig" ? 2 : 2, width: width - m.left - m.right })
    .forEach(() => {});
  svg.selectAll(".axis line").attr("x1", 0);
  const xt = svg.append("g").attr("class", "axis").attr("transform", `translate(0,${height - m.bottom})`);
  xt.selectAll("text").data([2010, 2014, 2018, 2022, 2026]).join("text")
    .attr("x", (d) => x(d)).attr("y", 32).attr("text-anchor", "middle").text((d) => d);
  svg.append("text").attr("class", "axis-title").attr("x", m.left - 52).attr("y", m.top - (format === "ig" ? 36 : 18))
    .text("Computing power used in training (log scale)");

  const ctx = rows.filter((d) => !d.frontier);
  const fr = rows.filter((d) => d.frontier);
  // a big year counter behind the field while it fills in
  const yearText = svg.append("text").attr("x", width - m.right).attr("y", height - m.bottom - 30).attr("text-anchor", "end")
    .style("font-size", format === "ig" ? "150px" : "120px").style("font-weight", 700).style("letter-spacing", "-0.04em").style("fill", "var(--context)").style("opacity", 0.5);
  const cs = svg.append("g").selectAll("circle").data(ctx).join("circle")
    .attr("cx", (d) => x(d.year)).attr("cy", (d) => y(d.flop)).attr("r", 3.6)
    .attr("fill", "var(--context)").attr("fill-opacity", 0.8);
  // whiskers: Epoch's 90% interval for the estimate's confidence status
  // the 90% range fades toward its ends: densest at the estimate, gone at the bounds
  const fade = svg.append("defs").append("linearGradient").attr("id", "fade").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 1);
  fade.append("stop").attr("offset", 0).attr("stop-color", "var(--accent)").attr("stop-opacity", 0);
  fade.append("stop").attr("offset", 0.5).attr("stop-color", "var(--accent)").attr("stop-opacity", 0.7);
  fade.append("stop").attr("offset", 1).attr("stop-color", "var(--accent)").attr("stop-opacity", 0);
  const ws = svg.append("g").selectAll("rect").data(fr).join("rect")
    .attr("x", (d) => x(d.year) - 2).attr("width", 4)
    .attr("y", (d) => y(d.hi)).attr("height", (d) => y(d.lo) - y(d.hi))
    .attr("fill", "url(#fade)");
  const gl = svg.append("defs").append("filter").attr("id", `dotglow-${format}`).attr("x", "-200%").attr("y", "-200%").attr("width", "500%").attr("height", "500%");
  gl.append("feGaussianBlur").attr("stdDeviation", 5).attr("result", "b");
  const gm = gl.append("feMerge"); gm.append("feMergeNode").attr("in", "b"); gm.append("feMergeNode").attr("in", "SourceGraphic");
  const fs = svg.append("g").selectAll("circle").data(fr).join("circle")
    .attr("cx", (d) => x(d.year)).attr("cy", (d) => y(d.flop)).attr("r", 5.5)
    .attr("fill", "var(--accent)").attr("stroke", "var(--bone)").attr("stroke-width", 1.5);

  // selective direct labels
  const lab = svg.append("g");
  const LBL = format === "ig" ? LABELS : LABELS_X;
  const labs = [];
  for (const d of fr.filter((d) => LBL[d.model])) {
    const L = LBL[d.model];
    const one = lab.append("g").datum(d);
    labs.push(one);
    if (!L.at) {
      one.append("text").attr("class", "lbl halo").attr("x", x(d.year) + 14).attr("y", y(d.flop)).attr("dy", "0.34em").text(L.text);
      continue;
    }
    const [lx, ly] = [x(L.at[0]), y(L.at[1])];
    const t = one.append("text").attr("class", "lbl halo").attr("x", lx).attr("y", ly).attr("dy", "0.34em").attr("text-anchor", "end").text(L.text);
    const px = x(d.year), py = y(d.flop), ang = Math.atan2(py - ly, px - lx - 8);
    one.insert("line", "text").attr("x1", lx + 8).attr("y1", ly).attr("x2", px - 9 * Math.cos(ang)).attr("y2", py - 9 * Math.sin(ang))
      .attr("stroke", "var(--graphite)").attr("stroke-width", 1.2);
  }

  // legend
  const lg = svg.append("g").style("display", format === "ig" ? "none" : null).attr("transform", format === "ig" ? `translate(${m.left - 46},${m.top - 80})` : `translate(${width - 690},${m.top - 24})`);
  legendRow(lg, [
    { text: format === "ig" ? "Frontier model, top 5 by compute at release" : "Biggest of their day", mark: (g) => { g.append("line").attr("x1", 7).attr("x2", 7).attr("y1", -12).attr("y2", 12).attr("stroke", "var(--accent)").attr("stroke-opacity", .45).attr("stroke-width", 2); g.append("circle").attr("cx", 7).attr("r", 6).attr("fill", "var(--accent)"); return 14; } },
    { text: "Other notable model", mark: (g) => { g.append("circle").attr("cx", 5).attr("r", 4.2).attr("fill", "var(--context)"); return 10; } },
  ]);

  // Epoch's published trend, as a figure: we don't have their fitted line, so none is drawn
  const hx = x(2010.4), hy = y(format === "ig" ? 2e26 : 4e24);
  const hero = svg.append("g");
  hero.append("text").attr("x", hx).attr("y", hy).style("font-size", format === "ig" ? "160px" : "120px").style("font-weight", 800).style("font-stretch", "88%")
    .style("letter-spacing", "-0.02em").style("fill", "var(--hero)").text("4.2x");
  const cap = hero.append("text").attr("class", "lbl").attr("x", hx + 4).attr("y", hy + 44).style("font-size", "28px");
  ["more compute every year", "for the largest models, 2018 to 2024"]
    .forEach((l, i) => cap.append("tspan").attr("x", hx + 4).attr("dy", i ? "1.3em" : 0).text(l));
  if (format === "ig") svg.append("text").attr("class", "note").attr("x", width - m.right).attr("y", height - m.bottom - 12).attr("text-anchor", "end")
    .text("Each streak shows the range of the estimate");

  // sweep 2010 -> late 2026, then the trend figure lands
  const Y0 = 2010, Y1 = 2027.3, SWEEP = 6, T0 = 0.3;
  const show = (t, yr) => Math.max(0, Math.min(1, (yearAt(t) - yr) / 0.5));
  const yearAt = (t) => Y0 + (Y1 - Y0) * Math.max(0, Math.min(1, (t - T0) / SWEEP));
  return {
    duration: T0 + SWEEP + 1.3,
    seek(t) {
      cs.attr("opacity", (d) => show(t, d.year));
      ws.attr("opacity", (d) => show(t, d.year));
      fs.attr("opacity", (d) => show(t, d.year)).attr("r", (d) => 5.5 * (0.4 + 0.6 * show(t, d.year)));
      labs.forEach((g) => g.attr("opacity", show(t, g.datum().year + 0.2)));
      const sweeping = t < T0 + SWEEP + 0.2;
      yearText.text(Math.min(2026, Math.floor(yearAt(t)))).style("display", sweeping ? null : "none");
      hero.attr("opacity", span(t, T0 + SWEEP, T0 + SWEEP + 0.8));
    },
  };
}

function disclosure({ el, width, height, data }) {
  const fr = data.frontierAll.filter((d) => d.year >= 2016);
  const years = d3.range(2016, 2027);
  const m = { top: 70, right: 10, bottom: 50, left: 10 };
  const svg = d3.select(el).append("svg").attr("viewBox", `0 0 ${width} ${height}`);
  const x = d3.scaleBand().domain(years).range([m.left, width - m.right]).padding(0.1);
  const maxStack = d3.max(years, (yr) => fr.filter((d) => Math.floor(d.year) === yr).length);
  const step = Math.min(x.bandwidth() * 0.92, (height - m.top - m.bottom - 40) / maxStack);
  const r = (step - 8) / 2;
  const base = height - m.bottom;
  svg.append("line").attr("x1", m.left).attr("x2", width - m.right).attr("y1", base + 4).attr("y2", base + 4).attr("stroke", "var(--hairline)");
  const marks = [];
  for (const yr of years) {
    const ms = fr.filter((d) => Math.floor(d.year) === yr).sort((a, b) => CONF4.indexOf(a.confidence) - CONF4.indexOf(b.confidence));
    const cx = x(yr) + x.bandwidth() / 2;
    ms.forEach((d, i) => {
      const g = svg.append("g").attr("transform", `translate(${cx},${base - r - 6 - i * step})`);
      glyph(g, d.confidence, d.confidence === "Confident" ? r : r - 2);
      marks.push({ g, yi: yr - years[0], i });
    });
    svg.append("text").attr("class", "axis-title").attr("x", cx).attr("y", base + 36).attr("text-anchor", "middle")
      .style("font-size", "23px").text(yr === 2026 ? "2026*" : `’${String(yr).slice(2)}`);
  }
  const lg = svg.append("g").attr("transform", `translate(${m.left + 4},${m.top - 48})`);
  legendRow(lg, CONF4.map((c) => ({ text: CONF_TEXT[c], mark: (g) => { glyph(g.append("g").attr("transform", "translate(11,0)"), c, c === "Confident" ? 11 : 10); return 22; } })), { gap: 24 });
  svg.append("text").attr("class", "note").attr("x", width - m.right).attr("y", m.top + 10).attr("text-anchor", "end").text("One mark per record; GPT-4o has 5. *To 9 Sep.");
  // year by year, each column stacking up
  return {
    duration: 0.3 + years.length * 0.45 + 0.6,
    seek: (t) => marks.forEach(({ g, yi, i }) => g.attr("opacity", span(t, 0.3 + yi * 0.45 + i * 0.04, 0.3 + yi * 0.45 + i * 0.04 + 0.3))),
  };
}

function ranges({ el, width, height, data }) {
  const fr = data.models.filter((d) => d.frontier && d.year >= 2023).sort((a, b) => a.year - b.year);
  const m = { top: 54, right: 24, bottom: 46, left: 420 };
  const svg = d3.select(el).append("svg").attr("viewBox", `0 0 ${width} ${height}`);
  const x = d3.scaleLog().domain([1e22, 1e29]).range([m.left, width - m.right]);
  const y = d3.scaleBand().domain(fr.map((d) => d.model)).range([m.top, height - m.bottom]).padding(0.3);
  const ax = svg.append("g").attr("class", "axis");
  for (let e = 22; e <= 29; e++) {
    ax.append("line").attr("x1", x(10 ** e)).attr("x2", x(10 ** e)).attr("y1", m.top - 10).attr("y2", height - m.bottom);
    if (e % 1 === 0) pow10(ax.append("text").attr("x", x(10 ** e)).attr("y", height - m.bottom + 32).attr("text-anchor", "middle"), e);
  }
  svg.append("text").attr("class", "axis-title").attr("x", width - m.right).attr("y", m.top - 24).attr("text-anchor", "end").text("Training compute, FLOP (log scale)");
  const bars = [];
  for (const d of fr) {
    const cy = y(d.model) + y.bandwidth() / 2;
    const bar = svg.append("line").attr("y1", cy).attr("y2", cy);
    bars.push({ bar, d });
    bar.attr("stroke", "var(--accent)").attr("stroke-opacity", 0.45).attr("stroke-width", 4).attr("stroke-linecap", "round");
    glyph(svg.append("g").attr("transform", `translate(${x(d.flop)},${cy})`), d.confidence, 8);
    const name = d.model.replace(" (Mar 2023)", "").replace(" (Jun 2023)", " (June version)").replace(" (preview)", "");
    svg.append("text").attr("class", "lbl").attr("x", m.left - 26).attr("y", cy).attr("dy", "0.34em").attr("text-anchor", "end").style("font-size", "25px").text(name);
    svg.append("text").attr("class", "lbl-sub").attr("x", 0).attr("y", cy).attr("dy", "0.34em").style("font-size", "22px")
      .text(d3.utcFormat("%b %Y")(new Date(d.date)));
  }
  const lg = svg.append("g").attr("transform", `translate(0,${m.top - 30})`);
  legendRow(lg, CONF.map((c) => ({ text: c, mark: (g) => { glyph(g.append("g").attr("transform", "translate(9,0)"), c, 8); return 18; } })), { gap: 24, size: 21 });
  // the ranges open out from each estimate (log space, so symmetric on screen)
  return {
    duration: 2.6,
    seek: (t) => bars.forEach(({ bar, d }, i) => {
      const p = span(t, 0.3 + i * 0.07, 1.2 + i * 0.07);
      bar.attr("x1", x(d.flop) - p * (x(d.flop) - x(d.lo))).attr("x2", x(d.flop) + p * (x(d.hi) - x(d.flop)));
    }),
  };
}

mountPiece({
  slug: "training-compute",
  title: "Training compute",
  series: "The AI landscape",
  variants: VARIANTS,
  variant: "field",
  // this piece's own background: a port of /generatives "phyllotaxis"
  source: SOURCE,
  async load() {
    const models = await d3.csv("../../data/training-compute/clean.csv", (r) => ({
      model: r.model, org: r.organization, date: r.publication_date, year: +r.year,
      flop: +r.training_compute_flop, lo: +r.ci90_low_flop, hi: +r.ci90_high_flop,
      confidence: r.confidence, frontier: r.frontier === "1",
    }));
    const data = { models };
    data.frontierAll = await d3.csv("../../data/training-compute/clean-frontier.csv", (r) => ({ model: r.model, year: +r.year, confidence: r.confidence }));
    // copy on slides 2 and 3 quotes these; fail loudly if the data moves
    const tally = (lo, hi) => {
      const f = data.frontierAll.filter((d) => Math.floor(d.year) >= lo && Math.floor(d.year) <= hi);
      return [f.length, f.filter((d) => d.confidence === "Confident").length, f.filter((d) => d.confidence === "No estimate").length];
    };
    const want = { "2019-2022": [27, 24, 0], "2023-2026": [27, 5, 10] };
    for (const [k, v] of Object.entries(want)) {
      const got = tally(...k.split("-").map(Number));
      if (got.join() !== v.join()) throw new Error(`disclosure copy out of date: ${k} ${got}`);
    }
    return data;
  },
  slides: [
    {
      id: "hook", formats: ["ig", "x"],
      title: "AI's computing power has grown 4x a year",
      sub: "Each dot is an AI model. Bright ones were the biggest of their day.",
      alt: "Scatter plot on a log scale of training compute for 478 notable AI models, 2010 to 2026, rising from about 10 to the 17 FLOP for AlexNet in 2012 to about 10 to the 27 for GPT-6 Astra in 2026.",
      draw: scatter,
      bg: (ctx, W, H, t, f) => phyllotaxis(ctx, W, H, t, f === "ig" ? { corner: { cx: 0.9, cy: 0.075, r: 0.2 }, size: 0.15, n: 900, alpha: 0.9 } : { corner: { cx: 0.92, cy: 0.13, r: 0.17 }, size: 0.12, n: 900, alpha: 0.9 }),
      titleSize: { ig: 96 },
    },
    {
      id: "disclosure",
      title: "The newest giants are the hardest to measure",
      sub: "How sure Epoch AI is of each frontier estimate. 2019 to 2022: 24 of 27 confident. Since 2023: 5 of 27.",
      alt: "Stacked marks per year, 2016 to 2026. Up to 2022 nearly all frontier models have confident estimates; from 2023 most are likely or speculative.",
      draw: disclosure,
      source: SOURCE_DATA,
    },
    {
      id: "ranges",
      title: "For the newest models, the honest answer is a range",
      sub: "Frontier models since 2023, with Epoch AI's 90% range. A speculative one spans nearly 1,000x.",
      alt: "Range plot of 17 frontier models released 2023 to 2026, each with a point estimate and a bar showing Epoch AI's 90% interval, from plus or minus 3x to plus or minus 31x.",
      draw: ranges,
      source: SOURCE_DATA,
    },
    {
      id: "sources",
      title: "Sources and method",
      html: () => `
        <h3>Data</h3>
        <p>Epoch AI, <i>Data on Notable AI Models</i>, notable_ai_models.csv, downloaded 5 Oct 2026 (records to 9 Sep 2026). Free to use under CC BY.</p>
        <p>Epoch AI, <i>Training compute of frontier AI models grows by 4-5x per year</i>, J. Sevilla and E. Roldán, 28 May 2024. The 4.2x figure is their bootstrap fit, 2018 to May 2024, for models in the running top 10 by compute. That is a wider set than the blue dots.</p>
        <h3>What the marks mean</h3>
        <ul>
          <li>Training compute is Epoch's estimate in floating point operations. Labs often don't publish it, so Epoch rebuilds it from hardware, training time and other clues.</li>
          <li>Each estimate has a confidence status that Epoch defines as a 90% interval: confident ±3x, likely ±10x, speculative ±31x. The bars show those intervals.</li>
          <li>Blue dots are Epoch's frontier models: top five by training compute when released. 540 notable models have a compute estimate, 478 from 2010 on. 10 frontier models since 2023 have none.</li>
        </ul>
        <h3>What this doesn't show</h3>
        <ul>
          <li>Compute isn't capability, cost or energy. Models without a public compute estimate are missing.</li>
          <li>Estimates get revised as labs disclose more. 2026 covers January to 9 September only.</li>
        </ul>`,
    },
  ],
});
</script>
</body>
</html>
