<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <!-- Stand-in for Geoffrey Irving's portrait until a licensed photograph is supplied.
       A 50p: seven sides, and fifty is his number. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1d1f26"/>
      <stop offset="0.6" stop-color="#0f1015"/>
      <stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9ecf0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c828c" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <!-- heptagon centred at (450,470), radius 300 -->
  <polygon points="450,170 684.6,282.8 742.5,536.6 580.4,740.6 319.6,740.6 157.5,536.6 215.4,282.8"
           fill="none" stroke="url(#rim)" stroke-width="5"/>
  <polygon points="450,214 650.2,310.4 699.7,527 561.2,701.2 338.8,701.2 200.3,527 249.8,310.4"
           fill="none" stroke="#ECEAE6" stroke-opacity="0.12" stroke-width="2"/>
  <text x="450" y="545" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="800" font-size="230" letter-spacing="-10" fill="#E0481B">50%</text>
</svg>
