<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The instrument in miniature: a line, solid to now and dashed after it,
       with a marker dropped in the future. -->
  <rect width="32" height="32" fill="#0b0c0e"/>
  <path d="M3 20h11" stroke="#f2ede2" stroke-width="2.5"/>
  <path d="M14 20h15" stroke="#f2ede2" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.5"/>
  <path d="M23 20V9" stroke="#4a9bef" stroke-width="2.5"/>
  <circle cx="23" cy="8" r="3.5" fill="#4a9bef"/>
</svg>
